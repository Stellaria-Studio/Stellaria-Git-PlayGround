name: Stellaria Playground Credentials

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: stellaria-credential-${{ github.event.pull_request.user.login }}
  cancel-in-progress: false

jobs:
  issue-credential:
    if: github.event.pull_request.merged == true && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest

    steps:
      - name: Update contributor credential and badge
        uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('crypto');
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const login = pr.user.login;
            const body = pr.body || '';
            const credentialPath = `credentials/${login}.json`;
            const badgePath = `badges/${login}.svg`;
            const now = new Date().toISOString();

            const CORE = [
              'FIRST_CONTACT',
              'BRANCH_EXPLORER',
              'CHECKLIST_KEEPER',
              'REVIEW_PASS',
              'RETURNING_CONTRIBUTOR',
              'GREEN_LIGHT',
            ];

            const CLEARANCE_TITLES = [
              'Visitor Interface',
              'Commit Initiate',
              'Branch Operator',
              'Merge Navigator',
              'Repository Interface Clearance',
              'Advanced Collaboration Clearance',
              'PlayGround Flight Clearance',
            ];

            function makeCallsign(holder) {
              const digest = crypto.createHash('sha256').update(holder.toLowerCase()).digest('hex');
              const prefixes = ['Aster', 'Nova', 'Lunar', 'Nebula', 'Comet', 'Aurora', 'Solar', 'Vega'];
              const nouns = ['Vector', 'Beacon', 'Orbit', 'Kernel', 'Signal', 'Photon', 'Relay', 'Pilot'];
              const a = prefixes[parseInt(digest.slice(0, 2), 16) % prefixes.length];
              const b = nouns[parseInt(digest.slice(2, 4), 16) % nouns.length];
              return `${a}-${b}-${digest.slice(4, 8).toUpperCase()}`;
            }

            function clearanceFor(achievements) {
              const level = CORE.filter(code => achievements.has(code)).length;
              return {
                level,
                code: `SPC-CL-${level}`,
                title: CLEARANCE_TITLES[level],
              };
            }

            function escapeXml(value) {
              return String(value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&apos;');
            }

            function makeBadge(record) {
              const clearance = record.clearance || { code: 'SPC-CL-0', title: 'Visitor Interface' };
              const pass = record.aethra_fanwork_pass && record.aethra_fanwork_pass.active;
              const right = `${clearance.code} · ${clearance.title}${pass ? ' · AETHRA PASS' : ''}`;
              const left = 'STELLARIA SPC';
              const leftWidth = 118;
              const rightWidth = Math.max(250, Math.min(560, 92 + right.length * 6.4));
              const width = leftWidth + rightWidth;
              const safeLeft = escapeXml(left);
              const safeRight = escapeXml(right);
              const safeHolder = escapeXml(record.holder);
              const safeId = escapeXml(record.credential_id);

              return `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="28" role="img" aria-label="${safeId}: ${safeRight}">
  <title>${safeId} · @${safeHolder} · ${safeRight}</title>
  <linearGradient id="g" x2="0" y2="100%">
    <stop offset="0" stop-color="#fff" stop-opacity=".11"/>
    <stop offset="1" stop-opacity=".11"/>
  </linearGradient>
  <clipPath id="r"><rect width="${width}" height="28" rx="7"/></clipPath>
  <g clip-path="url(#r)">
    <rect width="${leftWidth}" height="28" fill="#111827"/>
    <rect x="${leftWidth}" width="${rightWidth}" height="28" fill="${pass ? '#6d28d9' : '#334155'}"/>
    <rect width="${width}" height="28" fill="url(#g)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600">
    <text x="${leftWidth / 2}" y="18">${safeLeft}</text>
    <text x="${leftWidth + rightWidth / 2}" y="18">${safeRight}</text>
  </g>
</svg>\n`;
            }

            async function readTextFile(path, ref) {
              try {
                const resp = await github.rest.repos.getContent({ owner, repo, path, ref });
                if (Array.isArray(resp.data) || resp.data.type !== 'file') return null;
                return {
                  sha: resp.data.sha,
                  text: Buffer.from(resp.data.content, 'base64').toString('utf8'),
                };
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
            }

            async function upsertTextFile(path, text, message, knownSha = null) {
              let sha = knownSha;
              if (!sha) {
                const existing = await readTextFile(path, pr.base.ref);
                if (existing) sha = existing.sha;
              }
              const args = {
                owner,
                repo,
                path,
                message,
                content: Buffer.from(text, 'utf8').toString('base64'),
                branch: pr.base.ref,
              };
              if (sha) args.sha = sha;
              return github.rest.repos.createOrUpdateFileContents(args);
            }

            const existing = await readTextFile(credentialPath, pr.base.ref);
            let existingSha = existing && existing.sha;
            let record = {
              schema_version: 2,
              credential_id: `SPC-GIT-${login}`,
              holder: login,
              issuer: 'Stellaria Git PlayGround',
              callsign: makeCallsign(login),
              clearance: {
                level: 0,
                code: 'SPC-CL-0',
                title: CLEARANCE_TITLES[0],
              },
              achievements: [],
              prestige: [],
              tuition: {
                creative: false,
                dress: false,
              },
              aethra_fanwork_pass: {
                active: false,
                granted_by: null,
                granted_at: null,
                evidence_pr: null,
                terms: 'AETHRA-FANWORK-PASS.md',
              },
              verification: {
                page: `https://stellaria-studio.github.io/Stellaria-Git-PlayGround/?id=${encodeURIComponent(`SPC-GIT-${login}`)}`,
                record: credentialPath,
                badge: badgePath,
              },
              evidence: [],
              created_at: now,
              updated_at: now,
            };

            if (existing) {
              const parsed = JSON.parse(existing.text);
              record = {
                ...record,
                ...parsed,
                schema_version: 2,
                credential_id: `SPC-GIT-${login}`,
                holder: login,
                issuer: 'Stellaria Git PlayGround',
                callsign: parsed.callsign || makeCallsign(login),
                tuition: { ...record.tuition, ...(parsed.tuition || {}) },
                aethra_fanwork_pass: {
                  ...record.aethra_fanwork_pass,
                  ...(parsed.aethra_fanwork_pass || {}),
                },
                achievements: Array.isArray(parsed.achievements) ? parsed.achievements : [],
                prestige: Array.isArray(parsed.prestige) ? parsed.prestige : [],
                evidence: Array.isArray(parsed.evidence) ? parsed.evidence : [],
                verification: { ...record.verification, ...(parsed.verification || {}) },
              };
            }

            const achievements = new Set(record.achievements);
            const newlyGranted = [];

            function grant(code) {
              if (!achievements.has(code)) {
                achievements.add(code);
                newlyGranted.push(code);
              }
            }

            // Core achievements.
            grant('FIRST_CONTACT');

            const headRepo = pr.head.repo && pr.head.repo.full_name;
            const baseRepo = pr.base.repo && pr.base.repo.full_name;
            if (pr.head.ref !== pr.base.ref || headRepo !== baseRepo) {
              grant('BRANCH_EXPLORER');
            }

            const checkboxLines = body
              .split(/\r?\n/)
              .filter(line => /^\s*-\s*\[[ xX]\]/.test(line));
            const allChecked = checkboxLines.length >= 3 && checkboxLines.every(
              line => /^\s*-\s*\[[xX]\]/.test(line)
            );
            if (allChecked) grant('CHECKLIST_KEEPER');

            try {
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100,
              });
              if (reviews.some(review => review.state === 'APPROVED')) grant('REVIEW_PASS');
            } catch (error) {
              core.warning(`Could not inspect reviews: ${error.message}`);
            }

            try {
              const query = `repo:${owner}/${repo} is:pr is:merged author:${login}`;
              const result = await github.rest.search.issuesAndPullRequests({ q: query, per_page: 1 });
              if (result.data.total_count >= 2) grant('RETURNING_CONTRIBUTOR');
            } catch (error) {
              core.warning(`Could not count merged PRs: ${error.message}`);
            }

            try {
              const checks = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: pr.head.sha,
                per_page: 100,
              });
              const runs = checks.data.check_runs || [];
              const accepted = new Set(['success', 'neutral', 'skipped']);
              const green = runs.length > 0 && runs.every(run =>
                run.status === 'completed' && accepted.has(run.conclusion)
              );
              if (green) grant('GREEN_LIGHT');
            } catch (error) {
              core.warning(`Could not inspect check runs: ${error.message}`);
            }

            // Tuition is declared by the PR template and accepted by maintainer merge.
            const dressTuition = /<!--\s*tuition:\s*dress\s*-->/i.test(body);
            const creativeTuition = /<!--\s*tuition:\s*creative\s*-->/i.test(body);
            if (dressTuition) {
              record.tuition.dress = true;
              grant('TUITION_PAID_DRESS');
            }
            if (creativeTuition) {
              record.tuition.creative = true;
              grant('TUITION_PAID_CREATIVE');
            }

            record.achievements = Array.from(achievements).sort();
            record.clearance = clearanceFor(achievements);
            record.callsign = record.callsign || makeCallsign(login);

            const prestige = new Set(record.prestige || []);
            if (record.tuition.creative) prestige.add('CREATIVE_ROUTE');
            if (record.tuition.dress) prestige.add('DRESS_ROUTE');

            const hasAllCore = CORE.every(code => achievements.has(code));
            const hadPass = Boolean(record.aethra_fanwork_pass.active);
            const qualifiesByDress = achievements.has('TUITION_PAID_DRESS');
            const qualifies = qualifiesByDress || hasAllCore;

            if (qualifies && !hadPass) {
              record.aethra_fanwork_pass = {
                active: true,
                granted_by: qualifiesByDress ? 'dress-tuition' : 'all-core-achievements',
                granted_at: now,
                evidence_pr: pr.number,
                terms: 'AETHRA-FANWORK-PASS.md',
              };
            } else if (qualifies && hadPass) {
              record.aethra_fanwork_pass.active = true;
              record.aethra_fanwork_pass.terms = 'AETHRA-FANWORK-PASS.md';
            }
            if (record.aethra_fanwork_pass.active) prestige.add('AETHRA_PASS_HOLDER');
            record.prestige = Array.from(prestige).sort();

            if (!record.evidence.some(item => item.pull_request === pr.number)) {
              record.evidence.push({
                pull_request: pr.number,
                url: pr.html_url,
                merged_at: pr.merged_at,
                head_sha: pr.head.sha,
              });
            }

            record.verification = {
              page: `https://stellaria-studio.github.io/Stellaria-Git-PlayGround/?id=${encodeURIComponent(record.credential_id)}`,
              record: credentialPath,
              badge: badgePath,
            };
            record.updated_at = now;

            await upsertTextFile(
              credentialPath,
              `${JSON.stringify(record, null, 2)}\n`,
              `chore(credentials): update @${login}`,
              existingSha
            );

            await upsertTextFile(
              badgePath,
              makeBadge(record),
              `chore(badges): update @${login}`
            );

            const verifyUrl = record.verification.page;
            const badgeRaw = `https://raw.githubusercontent.com/${owner}/${repo}/${pr.base.ref}/${badgePath}`;
            const lines = [
              '🌌 **Stellaria Playground Credential updated**',
              '',
              `Credential: \`${record.credential_id}\``,
              `Callsign: **${record.callsign}**`,
              `Clearance: **${record.clearance.code} · ${record.clearance.title}**`,
              `Verify: ${verifyUrl}`,
            ];

            if (newlyGranted.length > 0) {
              lines.push('', '**New achievements**');
              for (const code of newlyGranted) lines.push(`- \`${code}\``);
            } else {
              lines.push('', 'No new achievement this time, but the PR has been added as evidence.');
            }

            lines.push('', `Core progress: ${record.clearance.level}/${CORE.length}`);

            if (record.aethra_fanwork_pass.active) {
              lines.push(
                '',
                '✨ **AETHRA_FANWORK_PASS: ACTIVE**',
                '',
                `Terms: https://github.com/${owner}/${repo}/blob/${pr.base.ref}/AETHRA-FANWORK-PASS.md`
              );
            }

            lines.push(
              '',
              '**Profile badge**',
              '',
              `\`[![Stellaria SPC](${badgeRaw})](${verifyUrl})\``,
              '',
              '_PlayGround credential only; no repository/admin/member/professional privileges are granted._'
            );

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body: lines.join('\n'),
            });