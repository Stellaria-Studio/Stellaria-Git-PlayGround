name: Stellaria Playground Credentials

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: stellaria-credential-${{ github.event.pull_request.user.login }}
  cancel-in-progress: false

jobs:
  issue-credential:
    if: github.event.pull_request.merged == true && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest

    steps:
      - name: Update contributor credential
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const login = pr.user.login;
            const body = pr.body || '';
            const credentialPath = `credentials/${login}.json`;
            const now = new Date().toISOString();

            const CORE = [
              'FIRST_CONTACT',
              'BRANCH_EXPLORER',
              'CHECKLIST_KEEPER',
              'REVIEW_PASS',
              'RETURNING_CONTRIBUTOR',
              'GREEN_LIGHT',
            ];

            let existingSha = null;
            let record = {
              schema_version: 1,
              credential_id: `SPC-GIT-${login}`,
              holder: login,
              issuer: 'Stellaria Git PlayGround',
              achievements: [],
              tuition: {
                creative: false,
                dress: false,
              },
              aethra_fanwork_pass: {
                active: false,
                granted_by: null,
                granted_at: null,
                evidence_pr: null,
                terms: 'AETHRA-FANWORK-PASS.md',
              },
              evidence: [],
              created_at: now,
              updated_at: now,
            };

            // Load an existing credential if this contributor already has one.
            try {
              const resp = await github.rest.repos.getContent({
                owner,
                repo,
                path: credentialPath,
                ref: pr.base.ref,
              });

              if (!Array.isArray(resp.data) && resp.data.type === 'file') {
                existingSha = resp.data.sha;
                const text = Buffer.from(resp.data.content, 'base64').toString('utf8');
                const parsed = JSON.parse(text);
                record = {
                  ...record,
                  ...parsed,
                  tuition: { ...record.tuition, ...(parsed.tuition || {}) },
                  aethra_fanwork_pass: {
                    ...record.aethra_fanwork_pass,
                    ...(parsed.aethra_fanwork_pass || {}),
                  },
                  achievements: Array.isArray(parsed.achievements) ? parsed.achievements : [],
                  evidence: Array.isArray(parsed.evidence) ? parsed.evidence : [],
                };
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const achievements = new Set(record.achievements);
            const newlyGranted = [];

            function grant(code) {
              if (!achievements.has(code)) {
                achievements.add(code);
                newlyGranted.push(code);
              }
            }

            // 1) A merged PR is First Contact.
            grant('FIRST_CONTACT');

            // 2) The PR came from a non-default branch or another fork.
            const headRepo = pr.head.repo && pr.head.repo.full_name;
            const baseRepo = pr.base.repo && pr.base.repo.full_name;
            if (pr.head.ref !== pr.base.ref || headRepo !== baseRepo) {
              grant('BRANCH_EXPLORER');
            }

            // 3) At least three checklist items exist and every one is checked.
            const checkboxLines = body
              .split(/\r?\n/)
              .filter(line => /^\s*-\s*\[[ xX]\]/.test(line));
            const allChecked = checkboxLines.length >= 3 && checkboxLines.every(
              line => /^\s*-\s*\[[xX]\]/.test(line)
            );
            if (allChecked) {
              grant('CHECKLIST_KEEPER');
            }

            // 4) At least one approved review on this PR.
            try {
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100,
              });
              if (reviews.some(review => review.state === 'APPROVED')) {
                grant('REVIEW_PASS');
              }
            } catch (error) {
              core.warning(`Could not inspect reviews: ${error.message}`);
            }

            // 5) Two or more merged PRs authored by this GitHub user.
            try {
              const query = `repo:${owner}/${repo} is:pr is:merged author:${login}`;
              const result = await github.rest.search.issuesAndPullRequests({
                q: query,
                per_page: 1,
              });
              if (result.data.total_count >= 2) {
                grant('RETURNING_CONTRIBUTOR');
              }
            } catch (error) {
              core.warning(`Could not count merged PRs: ${error.message}`);
            }

            // 6) All detected Check Runs on the merged PR head are green-ish.
            try {
              const checks = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: pr.head.sha,
                per_page: 100,
              });
              const runs = checks.data.check_runs || [];
              const accepted = new Set(['success', 'neutral', 'skipped']);
              const green = runs.length > 0 && runs.every(run =>
                run.status === 'completed' && accepted.has(run.conclusion)
              );
              if (green) {
                grant('GREEN_LIGHT');
              }
            } catch (error) {
              core.warning(`Could not inspect check runs: ${error.message}`);
            }

            // Tuition type is intentionally declared by the PR template and
            // effectively verified by maintainers when they choose to merge it.
            const dressTuition = /<!--\s*tuition:\s*dress\s*-->/i.test(body);
            const creativeTuition = /<!--\s*tuition:\s*creative\s*-->/i.test(body);

            if (dressTuition) {
              record.tuition.dress = true;
              grant('TUITION_PAID_DRESS');
            }
            if (creativeTuition) {
              record.tuition.creative = true;
              grant('TUITION_PAID_CREATIVE');
            }

            record.achievements = Array.from(achievements).sort();

            const hasAllCore = CORE.every(code => achievements.has(code));
            const hadPass = Boolean(record.aethra_fanwork_pass.active);
            const qualifiesByDress = achievements.has('TUITION_PAID_DRESS');
            const qualifies = qualifiesByDress || hasAllCore;

            if (qualifies && !hadPass) {
              record.aethra_fanwork_pass = {
                active: true,
                granted_by: qualifiesByDress ? 'dress-tuition' : 'all-core-achievements',
                granted_at: now,
                evidence_pr: pr.number,
                terms: 'AETHRA-FANWORK-PASS.md',
              };
            } else if (qualifies && hadPass) {
              record.aethra_fanwork_pass.active = true;
              record.aethra_fanwork_pass.terms = 'AETHRA-FANWORK-PASS.md';
            }

            if (!record.evidence.some(item => item.pull_request === pr.number)) {
              record.evidence.push({
                pull_request: pr.number,
                url: pr.html_url,
                merged_at: pr.merged_at,
                head_sha: pr.head.sha,
              });
            }

            record.updated_at = now;

            const content = Buffer.from(
              `${JSON.stringify(record, null, 2)}\n`,
              'utf8'
            ).toString('base64');

            const updateArgs = {
              owner,
              repo,
              path: credentialPath,
              message: `chore(credentials): update @${login}`,
              content,
              branch: pr.base.ref,
            };
            if (existingSha) updateArgs.sha = existingSha;

            await github.rest.repos.createOrUpdateFileContents(updateArgs);

            const credentialUrl = `https://github.com/${owner}/${repo}/blob/${pr.base.ref}/${credentialPath}`;
            const lines = [
              '🌌 **Stellaria Playground Credential updated**',
              '',
              `Credential: \`${record.credential_id}\``,
              `Record: ${credentialUrl}`,
            ];

            if (newlyGranted.length > 0) {
              lines.push('', '**New achievements**');
              for (const code of newlyGranted) lines.push(`- \`${code}\``);
            } else {
              lines.push('', 'No new achievement this time, but the PR has been added as evidence.');
            }

            lines.push('', `Core progress: ${CORE.filter(code => achievements.has(code)).length}/${CORE.length}`);

            if (record.aethra_fanwork_pass.active) {
              lines.push(
                '',
                '✨ **AETHRA_FANWORK_PASS: ACTIVE**',
                '',
                `Terms: https://github.com/${owner}/${repo}/blob/${pr.base.ref}/AETHRA-FANWORK-PASS.md`
              );
            }

            lines.push('', '_Playground credential only; no repository/admin/member privileges are granted._');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body: lines.join('\n'),
            });
