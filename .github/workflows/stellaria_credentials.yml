name: Stellaria Playground Credential Reconcile

on:
  push:
    branches: [master]
    paths-ignore:
      - 'credentials/**'
      - 'badges/**'
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: read
  issues: write
  checks: read

concurrency:
  group: stellaria-credential-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == 'Stellaria-Studio/Stellaria-Git-PlayGround'
    runs-on: ubuntu-latest

    steps:
      - name: Run trusted Mission Control reconciler
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const path = '.github/scripts/reconcile-credentials.js';
            const response = await github.rest.repos.getContent({
              owner,
              repo,
              path,
              ref: 'master',
            });

            if (Array.isArray(response.data) || response.data.type !== 'file') {
              throw new Error(`${path} is not a regular file on trusted master.`);
            }

            const source = Buffer.from(response.data.content || '', 'base64').toString('utf8');
            const module = { exports: {} };
            const load = new Function('module', 'exports', 'require', source);
            load(module, module.exports, require);

            if (typeof module.exports !== 'function') {
              throw new Error(`${path} must export one async function.`);
            }

            await module.exports({ github, context, core });

      - name: Ask Pages to refresh
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'pages.yml',
                ref: 'master',
              });
              core.notice('Credential reconciliation completed; Pages refresh dispatched.');
            } catch (error) {
              core.warning(`Credential state is valid, but Pages refresh could not be dispatched: ${error.message}`);
            }
