name: Deploy Credential Verification Pages

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'credentials/**'
      - 'badges/**'
      - 'CREDENTIALS.md'
      - 'ACHIEVEMENTS.md'
      - 'AETHRA-FANWORK-PASS.md'
      - 'SECURITY-MODEL.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Assemble site via GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const ref = 'master';
            const out = path.join(process.env.GITHUB_WORKSPACE, '_site');

            fs.rmSync(out, { recursive: true, force: true });
            fs.mkdirSync(path.join(out, 'credentials'), { recursive: true });
            fs.mkdirSync(path.join(out, 'badges'), { recursive: true });

            async function get(remotePath) {
              const response = await github.rest.repos.getContent({
                owner,
                repo,
                path: remotePath,
                ref,
              });
              return response.data;
            }

            async function writeRemoteFile(remotePath, localPath) {
              const data = await get(remotePath);
              if (Array.isArray(data) || data.type !== 'file') {
                throw new Error(`${remotePath} is not a file`);
              }
              const bytes = Buffer.from(data.content || '', 'base64');
              fs.mkdirSync(path.dirname(localPath), { recursive: true });
              fs.writeFileSync(localPath, bytes);
            }

            async function copyDirectory(remoteDir, localDir, predicate = () => true) {
              let entries = [];
              try {
                const data = await get(remoteDir);
                if (!Array.isArray(data)) throw new Error(`${remoteDir} is not a directory`);
                entries = data;
              } catch (error) {
                if (error.status === 404) return;
                throw error;
              }

              for (const entry of entries) {
                if (entry.type !== 'file' || !predicate(entry.name)) continue;
                await writeRemoteFile(entry.path, path.join(localDir, entry.name));
              }
            }

            await copyDirectory('site', out);
            await copyDirectory('credentials', path.join(out, 'credentials'), name => name.endsWith('.json'));
            await copyDirectory('badges', path.join(out, 'badges'), name => name.endsWith('.svg'));

            await writeRemoteFile('CREDENTIALS.md', path.join(out, 'CREDENTIALS.md'));
            await writeRemoteFile('ACHIEVEMENTS.md', path.join(out, 'ACHIEVEMENTS.md'));
            await writeRemoteFile('AETHRA-FANWORK-PASS.md', path.join(out, 'AETHRA-FANWORK-PASS.md'));
            await writeRemoteFile('SECURITY-MODEL.md', path.join(out, 'SECURITY-MODEL.md'));

            fs.writeFileSync(path.join(out, '.nojekyll'), '');
            fs.writeFileSync(
              path.join(out, 'build.json'),
              `${JSON.stringify({
                repository: `${owner}/${repo}`,
                commit: context.sha,
                built_at: new Date().toISOString(),
                assembly: 'github-api-no-checkout',
              }, null, 2)}\n`
            );

            core.notice('Static Mission Control assembled without cloning the multi-gigabyte photo repository.');

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
