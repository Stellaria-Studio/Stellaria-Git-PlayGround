name: Guard Canonical Mission Control Artifacts

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    if: github.repository == 'Stellaria-Studio/Stellaria-Git-PlayGround'
    runs-on: ubuntu-latest
    steps:
      - name: Reject hand-written canonical credentials and badges
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const forbidden = files
              .map(file => file.filename)
              .filter(path =>
                (/^credentials\/.*\.json$/i.test(path) && path !== 'credentials/README.md') ||
                /^badges\/.*\.svg$/i.test(path)
              );

            if (forbidden.length) {
              core.setFailed([
                'Canonical Mission Control artifacts are generated by trusted workflows and cannot be edited through contributor PRs.',
                '',
                ...forbidden.map(path => `- ${path}`),
                '',
                'If a record is wrong, fix the underlying PR/review/tuition evidence or the reconciler, then let Mission Control regenerate it.',
              ].join('\n'));
              return;
            }

            core.notice('No hand-written canonical credential or badge artifacts detected.');
