name: Sync Upstream Dress

on:
  schedule:
    # Weekly, Sunday 03:17 UTC. Avoids the top-of-hour Actions rush.
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: stellaria-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Stellaria-Studio/Stellaria-Git-PlayGround'
    runs-on: ubuntu-latest

    steps:
      - name: Merge upstream into staging branch and gate it
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const baseBranch = 'master';
            const syncBranch = 'upstream-sync';
            const upstreamLabel = 'Cute-Dress/Dress';
            const marker = '<!-- stellaria-upstream-sync -->';

            async function getBranch(name) {
              return (await github.rest.repos.getBranch({ owner, repo, branch: name })).data;
            }

            async function ensureSyncBranch(masterSha) {
              try {
                await github.rest.git.updateRef({
                  owner,
                  repo,
                  ref: `heads/${syncBranch}`,
                  sha: masterSha,
                  force: true,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.git.createRef({
                  owner,
                  repo,
                  ref: `refs/heads/${syncBranch}`,
                  sha: masterSha,
                });
              }
            }

            async function findOpenSyncPr() {
              const prs = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head: `${owner}:${syncBranch}`,
                base: baseBranch,
                per_page: 10,
              });
              return prs.data[0] || null;
            }

            async function findOpenConflictIssue() {
              const q = `repo:${owner}/${repo} is:issue is:open in:title \"Upstream sync conflict\"`;
              const result = await github.rest.search.issuesAndPullRequests({ q, per_page: 10 });
              return result.data.items.find(item => !item.pull_request) || null;
            }

            const master = await getBranch(baseBranch);
            await ensureSyncBranch(master.commit.sha);

            let mergeMessage = '';
            try {
              const response = await github.rest.repos.mergeUpstream({
                owner,
                repo,
                branch: syncBranch,
              });
              mergeMessage = response.data.message || 'Upstream merge completed.';
              core.info(mergeMessage);
            } catch (error) {
              if (error.status !== 409) throw error;

              const issueBody = [
                marker,
                '# Upstream sync conflict',
                '',
                `The scheduled sync could not merge **${upstreamLabel}** into \`${syncBranch}\` automatically.`,
                '',
                `Base branch: \`${baseBranch}\``,
                `Master SHA: \`${master.commit.sha}\``,
                `Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                '',
                'This is intentionally a manual stop. The automation will never resolve a conflict by choosing upstream or Stellaria content on its own.',
                '',
                'Likely conflict hotspots include README / CONTRIBUTING / workflows because this fork intentionally diverges there.',
              ].join('\n');

              const existing = await findOpenConflictIssue();
              if (existing) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body: `Another sync attempt hit a conflict.\n\n${issueBody}`,
                });
              } else {
                await github.rest.issues.create({
                  owner,
                  repo,
                  title: 'Upstream sync conflict · manual resolution required',
                  body: issueBody,
                });
              }
              core.setFailed(`Upstream merge conflict: ${error.message}`);
              return;
            }

            const staged = await getBranch(syncBranch);
            if (staged.commit.sha === master.commit.sha) {
              core.notice('Already up to date with upstream.');
              return;
            }

            let pr = await findOpenSyncPr();
            const prBody = [
              marker,
              `Automated staging merge from **${upstreamLabel}**.`,
              '',
              `Sync branch: \`${syncBranch}\``,
              `Upstream status: ${mergeMessage}`,
              '',
              '### Safety policy',
              '',
              '- Changes only inside legacy contribution buckets `A-Z/` or `#/` may auto-merge.',
              '- Any README, license, documentation, workflow, template, Stellaria credential, site, badge, or other structural change is held for human review.',
              '- Merge conflicts never auto-resolve.',
              '',
              'This PR is created by the repository itself and does not award Playground credentials.',
            ].join('\n');

            if (!pr) {
              pr = (await github.rest.pulls.create({
                owner,
                repo,
                title: 'chore(upstream): sync Cute-Dress/Dress',
                head: syncBranch,
                base: baseBranch,
                body: prBody,
              })).data;
            } else {
              pr = (await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                title: 'chore(upstream): sync Cute-Dress/Dress',
                body: prBody,
              })).data;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const names = files.map(file => file.filename.replace(/\\/g, '/'));
            const safeLegacyContribution = path => /^(?:[A-Z]|#)\//.test(path);
            const canAutoMerge = names.length > 0 && names.every(safeLegacyContribution);

            const preview = names.slice(0, 80).map(name => `- \`${name}\``);
            if (names.length > 80) preview.push(`- … and ${names.length - 80} more files`);

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body: [
                marker,
                `Upstream staging contains **${names.length}** changed file(s).`,
                '',
                ...preview,
                '',
                canAutoMerge
                  ? '✅ All changed paths are legacy contribution buckets. Auto-merge is allowed.'
                  : '🛰️ Structural or Stellaria-owned paths are present. Mission Control review is required.',
              ].join('\n'),
            });

            if (canAutoMerge) {
              const merged = await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: pr.number,
                merge_method: 'merge',
                commit_title: 'chore(upstream): sync Cute-Dress/Dress',
                commit_message: 'Automated safe-path upstream sync. Only legacy A-Z/# contribution buckets changed.',
              });
              if (!merged.data.merged) {
                core.setFailed(`GitHub refused the safe upstream merge: ${merged.data.message}`);
              } else {
                core.notice(`Safe upstream sync merged as ${merged.data.sha}`);
              }
            } else {
              core.notice(`Upstream PR #${pr.number} is waiting for manual review.`);
            }