name: Grant Playground Achievement

on:
  workflow_dispatch:
    inputs:
      login:
        description: GitHub login that owns the credential
        required: true
        type: string
      achievement:
        description: Bonus achievement to grant
        required: true
        type: choice
        options:
          - CONFLICT_SURVIVOR
          - REBASE_ENJOYER
          - CI_DESTROYER
          - CI_REDEEMER
          - UPSTREAM_NAVIGATOR
          - MERGE_PILOT
          - DOCS_ORBITER
          - EXIF_PURIFIER
          - BLOB_MINIMALIST
          - HOTFIX_SURGEON
          - PATCH_CARTOGRAPHER
      evidence_url:
        description: Public PR / commit / workflow / issue evidence URL
        required: true
        type: string
      claim_issue:
        description: Optional Achievement Claim issue number to comment on and close
        required: false
        type: string

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: stellaria-manual-achievement-${{ inputs.login }}
  cancel-in-progress: false

jobs:
  grant:
    runs-on: ubuntu-latest
    steps:
      - name: Grant achievement from maintainer-reviewed evidence
        uses: actions/github-script@v7
        env:
          HOLDER: ${{ inputs.login }}
          ACHIEVEMENT: ${{ inputs.achievement }}
          EVIDENCE_URL: ${{ inputs.evidence_url }}
          CLAIM_ISSUE: ${{ inputs.claim_issue }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const login = (process.env.HOLDER || '').trim();
            const achievement = (process.env.ACHIEVEMENT || '').trim();
            const evidenceUrl = (process.env.EVIDENCE_URL || '').trim();
            const claimIssueRaw = (process.env.CLAIM_ISSUE || '').trim();
            const now = new Date().toISOString();

            const ALLOWED = new Set([
              'CONFLICT_SURVIVOR',
              'REBASE_ENJOYER',
              'CI_DESTROYER',
              'CI_REDEEMER',
              'UPSTREAM_NAVIGATOR',
              'MERGE_PILOT',
              'DOCS_ORBITER',
              'EXIF_PURIFIER',
              'BLOB_MINIMALIST',
              'HOTFIX_SURGEON',
              'PATCH_CARTOGRAPHER',
            ]);

            if (!/^[A-Za-z0-9](?:[A-Za-z0-9-]{0,38})$/.test(login)) {
              core.setFailed('Invalid GitHub login.');
              return;
            }
            if (!ALLOWED.has(achievement)) {
              core.setFailed(`Achievement is not in the maintainer-grant allowlist: ${achievement}`);
              return;
            }
            if (!/^https:\/\/github\.com\//i.test(evidenceUrl)) {
              core.setFailed('Evidence must be a public github.com URL.');
              return;
            }

            const path = `credentials/${login}.json`;
            let file;
            try {
              file = (await github.rest.repos.getContent({ owner, repo, path, ref: 'master' })).data;
            } catch (error) {
              if (error.status === 404) {
                core.setFailed(`No credential exists for @${login}. Merge at least one valid PR first.`);
                return;
              }
              throw error;
            }

            const record = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8'));
            if (record.status === 'renamed' && record.renamed_to) {
              core.setFailed(`@${login} is an alias. Grant the achievement to current holder @${record.renamed_to}.`);
              return;
            }

            const achievements = new Set(Array.isArray(record.achievements) ? record.achievements : []);
            const alreadyHad = achievements.has(achievement);
            achievements.add(achievement);
            record.achievements = Array.from(achievements).sort();

            const evidence = Array.isArray(record.achievement_evidence) ? record.achievement_evidence : [];
            const duplicateEvidence = evidence.some(item =>
              item.achievement === achievement && item.evidence_url === evidenceUrl
            );
            if (!duplicateEvidence) {
              evidence.push({
                achievement,
                evidence_url: evidenceUrl,
                granted_by: context.actor,
                granted_at: now,
                claim_issue: claimIssueRaw || null,
              });
            }
            record.achievement_evidence = evidence;

            const bonusCount = [...achievements].filter(code => ALLOWED.has(code)).length;
            const prestige = new Set(Array.isArray(record.prestige) ? record.prestige : []);
            if (bonusCount >= 3) prestige.add('BONUS_HUNTER');
            if (bonusCount >= 6) prestige.add('ACHIEVEMENT_GREMLIN');
            record.prestige = Array.from(prestige).sort();
            record.updated_at = now;

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch: 'master',
              sha: file.sha,
              message: `chore(achievements): grant ${achievement} to @${login}`,
              content: Buffer.from(`${JSON.stringify(record, null, 2)}\n`, 'utf8').toString('base64'),
            });

            const issueNumber = Number.parseInt(claimIssueRaw, 10);
            if (Number.isInteger(issueNumber) && issueNumber > 0) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: [
                  '🌌 **Mission Control achievement grant**',
                  '',
                  `Holder: @${login}`,
                  `Achievement: \`${achievement}\``,
                  `Evidence: ${evidenceUrl}`,
                  `Granted by: @${context.actor}`,
                  '',
                  alreadyHad ? 'The credential already contained this achievement; evidence was reconciled.' : 'Credential updated successfully.',
                ].join('\n'),
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issueNumber,
                state: 'closed',
                state_reason: 'completed',
              });
            }

            core.notice(`Granted ${achievement} to @${login}. Bonus count: ${bonusCount}.`);

      - name: Reconcile derived badge and Mission Control roster
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'stellaria_credentials.yml',
              ref: 'master',
            });
            core.notice('Credential reconciliation dispatched.');
