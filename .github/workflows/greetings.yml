name: Mission Control Greeting

on: [pull_request_target]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr-message: |
            🌌 **Stellaria PlayGround Mission Control online.**

            你好 @${{ github.actor }}，Telemetry 已收到。你的 PR 现在正在经历一套看起来很像航天器发射前检查、实际上主要是 Git / GitHub 基础流程的东西（doge）。

            请保持 PR 模板中的自查项完整，等待 Checks 与 Review。Merge 后，Credential 系统会根据可验证的 Git 行为更新你的成就、Callsign、Clearance 与 SVG Badge。

            - Credential spec: `CREDENTIALS.md`
            - Achievement catalog: `ACHIEVEMENTS.md`
            - Dress / Creative Tuition: `README.md`

            **Dream. Commit. Push. Become.**
